#----------------------- CORE -----------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

#----------------------- BLE CENTRAL + PERIPHERAL ----
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="EI-Monitor"

# BLE scanning (uses Zephyr native bt_le_scan_start — no NCS BT_SCAN library needed)

# GATT client features
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_ATT_PREPARE_COUNT=2

# Connection parameters — need 2: one to EI-Golioth peripheral, one from Android central
CONFIG_BT_MAX_CONN=2
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=255
CONFIG_BT_L2CAP_TX_MTU=247

#----------------------- HEAP / MEMORY ---------------
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

#----------------------- LOCAL SENSOR (IMU) ----------
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_EI_SENSOR_LOCAL=y

#----------------------- C++ ENABLED -----------------
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

#----------------------- LOGGING ---------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_BT_LOG_LEVEL_INF=y

#----------------------- STACK SIZE -------------------
CONFIG_MAIN_STACK_SIZE=16384
