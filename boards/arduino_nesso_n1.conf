# Arduino Nesso N1 (ESP32-C6, RISC-V) — local-sensor mode
#
# On-board sensor: Bosch BMI270 6-axis IMU (bosch,bmi270) on I2C0.
# The BMI270 node is already declared and enabled in the upstream Zephyr
# board DTS, so no extra overlay nodes are needed.
#
# NOTE: The Arduino Nesso N1 was introduced in Zephyr after v4.0.0.
# If the build cannot find the board, update west.yml to a newer Zephyr
# revision (e.g. v4.1.0 or main) and re-run `west update`.

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI270=y

CONFIG_EI_SENSOR_LOCAL=y

# ESP32-C6 needs more heap for BLE + sensor stack
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ESP32-C6 binary blobs must be fetched once before building:
#   west blobs fetch hal_espressif
