# Arduino Nano 33 BLE Sense — board-specific Kconfig fragment.
# Picked up automatically by CMake when building for this board.

# I2C bus (all on-board sensors live on I2C0)
CONFIG_I2C=y
CONFIG_SENSOR=y

# LSM9DS1 — accel + gyro (I2C 0x6B)
CONFIG_LSM9DS1=y

# HTS221 — temperature + humidity (I2C 0x5F)
CONFIG_HTS221=y

# LPS22HB — barometric pressure (I2C 0x5C)
CONFIG_LPS22HB=y

# APDS9960 — proximity / colour / gesture (I2C 0x39)
CONFIG_APDS9960=y

# Enable local sensor collection mode (no BLE GATT client scanner)
CONFIG_EI_SENSOR_LOCAL=y

# More heap for sensor buffers + optional EI inference
CONFIG_HEAP_MEM_POOL_SIZE=65536
